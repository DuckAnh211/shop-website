<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaWo Crotchet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">

<style>
:root{
	--bg:#fff8ef;
	--bg-accent:#ffe3c2;
	--panel:#fffdf8;
	--text:#2f241f;
	--muted:#725c51;
	--brand:#d9572b;
	--brand-strong:#bd471f;
	--line:#f0d9c7;
	--radius-lg:20px;
	--radius-md:14px;
	--shadow:0 16px 40px rgba(106, 52, 28, 0.14);
}

*{box-sizing:border-box}

body{
	margin:0;
	font-family:"Be Vietnam Pro",sans-serif;
	color:var(--text);
	background:
		radial-gradient(circle at 20% 10%, #ffd8ad 0%, transparent 45%),
		radial-gradient(circle at 85% 80%, #ffe7c9 0%, transparent 35%),
		var(--bg);
}

.topbar{
	max-width:1160px;
	margin:24px auto 0;
	padding:0 20px;
	display:flex;
	justify-content:space-between;
	align-items:center;
}

.brand{
	font-family:"Fraunces",serif;
	font-size:34px;
	margin:0;
	letter-spacing:.5px;
}

.nav a{
	display:inline-flex;
	align-items:center;
	color:var(--muted);
	text-decoration:none;
	font-weight:700;
	border:1px solid var(--line);
	padding:10px 14px;
	border-radius:999px;
	background:rgba(255,255,255,.65);
}

.nav{
	display:flex;
	gap:10px;
}

.hero{
	max-width:1160px;
	margin:16px auto 0;
	padding:28px 20px 8px;
}

.hero-box{
	background:linear-gradient(110deg,#fce7cf 0%, #ffd9ba 58%, #f6b88a 100%);
	border-radius:var(--radius-lg);
	padding:34px;
	display:grid;
	grid-template-columns:1.3fr 1fr;
	gap:24px;
	align-items:center;
	box-shadow:var(--shadow);
}

.hero h2{
	margin:0 0 12px;
	font-family:"Fraunces",serif;
	font-size:44px;
	line-height:1.05;
}

.hero p{
	margin:0;
	color:var(--muted);
	max-width:56ch;
}

.hero-pill{
	justify-self:end;
	background:rgba(255,255,255,.75);
	border:1px solid rgba(255,255,255,.85);
	border-radius:16px;
	padding:18px 20px;
	width:100%;
	max-width:260px;
}

.hero-pill strong{
	display:block;
	font-size:28px;
	color:var(--brand-strong);
}

.hero-pill span{
	color:var(--muted);
	font-size:14px;
}

.container{
	max-width:1160px;
	margin:0 auto;
	padding:18px 20px 50px;
}

.section-title{
	display:flex;
	justify-content:space-between;
	align-items:end;
	margin-bottom:14px;
}

.section-title h3{
	margin:0;
	font-size:26px;
}

.section-title p{
	margin:0;
	color:var(--muted);
}

.products{
	display:grid;
	grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
	gap:20px;
}

.product{
	background:var(--panel);
	border:1px solid var(--line);
	border-radius:var(--radius-md);
	overflow:hidden;
	display:flex;
	flex-direction:column;
	box-shadow:0 10px 24px rgba(80,50,29,.07);
	transform:translateY(18px);
	opacity:0;
	animation:cardIn .55s ease forwards;
}

@keyframes cardIn{
	to{
		opacity:1;
		transform:translateY(0);
	}
}

.product-media{
	position:relative;
}

.product img{
	width:100%;
	height:220px;
	object-fit:cover;
	display:block;
	cursor:zoom-in;
}

.thumbs{
	display:flex;
	gap:6px;
	margin-top:10px;
	flex-wrap:wrap;
}

.thumb{
	border:1px solid var(--line);
	border-radius:8px;
	padding:0;
	background:#fff;
	cursor:pointer;
	width:50px;
	height:50px;
	overflow:hidden;
}

.thumb img{
	width:100%;
	height:100%;
	object-fit:cover;
}

.thumb.active{
	outline:2px solid var(--brand);
	outline-offset:1px;
}

.discount{
	position:absolute;
	left:12px;
	top:12px;
	background:rgba(217,87,43,.96);
	color:#fff;
	padding:6px 10px;
	font-size:12px;
	font-weight:700;
	border-radius:999px;
}

.info{
	padding:14px;
	display:flex;
	flex-direction:column;
	gap:10px;
	flex:1;
}

.info h4{
	margin:0;
	font-size:18px;
}

.description{
	margin:0;
	color:var(--muted);
	font-size:14px;
	line-height:1.45;
	min-height:40px;
}

.prices{
	display:flex;
	align-items:center;
	gap:10px;
}

.price{
	color:var(--brand-strong);
	font-weight:800;
	font-size:20px;
}

.old-price{
	color:#9d877a;
	text-decoration:line-through;
}

.buy-btn{
	margin-top:auto;
	border:none;
	background:var(--brand);
	color:#fff;
	padding:11px;
	border-radius:10px;
	font-weight:700;
	cursor:pointer;
	transition:background .2s ease, transform .2s ease;
}

.buy-btn:hover{
	background:var(--brand-strong);
	transform:translateY(-2px);
}

.status{
	border:1px dashed var(--line);
	border-radius:14px;
	padding:18px;
	text-align:center;
	color:var(--muted);
	background:rgba(255,255,255,.65);
}

.lightbox{
	position:fixed;
	inset:0;
	background:rgba(20,13,10,.7);
	display:none;
	align-items:center;
	justify-content:center;
	padding:20px;
	z-index:999;
}

.lightbox.open{display:flex}

.lightbox-box{
	position:relative;
	max-width:min(940px,95vw);
	max-height:90vh;
	width:100%;
	background:#fff;
	border-radius:16px;
	padding:16px;
	box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.lightbox img{
	width:100%;
	max-height:72vh;
	object-fit:contain;
	border-radius:12px;
	background:#f8f0e8;
	cursor:ew-resize;
}

.lightbox-actions{
	margin-top:12px;
	display:flex;
	justify-content:space-between;
	gap:10px;
}

.lightbox-btn{
	border:1px solid var(--line);
	background:#fff;
	border-radius:10px;
	padding:9px 12px;
	cursor:pointer;
	font-weight:700;
	color:var(--text);
}

.lightbox-btn.close{
	position:absolute;
	right:12px;
	top:12px;
	border:none;
	width:36px;
	height:36px;
	border-radius:50%;
	font-size:18px;
	line-height:1;
	background:rgba(47,36,31,.08);
}

@media (max-width:920px){
	.hero-box{grid-template-columns:1fr}
	.hero-pill{justify-self:start}
}

@media (max-width:560px){
	.brand{font-size:28px}
	.hero h2{font-size:34px}
	.hero-box{padding:24px}
}
</style>
</head>

<body>
<header class="topbar">
	<h1 class="brand">KaWo Crotchet</h1>
	<nav class="nav">
		<a href="contacrt.html">Contact</a>
		<a href="login.html">Login</a>
	</nav>
</header>

<section class="hero">
	<div class="hero-box">
		<div>
			<h2>Handcrafted goods with a unique touch</h2>
			<p>Fresh collections are updated daily. Every product has real photos, clear pricing, and transparent discounts.</p>
		</div>
		<aside class="hero-pill">
			<strong id="productCount">0</strong>
			<span>Products currently available</span>
		</aside>
	</div>
</section>

<main class="container">
	<div class="section-title">
		<h3>Featured Products</h3>
		<p>Current price and original price are shown clearly</p>
	</div>
	<div id="products" class="products"></div>
</main>

<div id="lightbox" class="lightbox" aria-hidden="true">
	<div class="lightbox-box" role="dialog" aria-modal="true" aria-label="Zoomed product image viewer">
		<button id="closeLightbox" class="lightbox-btn close" type="button" aria-label="Close">x</button>
		<img id="lightboxImage" alt="Zoomed product image">
		<div class="lightbox-actions">
			<button id="prevImage" class="lightbox-btn" type="button">Previous</button>
			<button id="nextImage" class="lightbox-btn" type="button">Next</button>
		</div>
	</div>
</div>

<script src="script.js"></script>
</body>
</html>
